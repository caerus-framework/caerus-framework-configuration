name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: caerus-framework/caerus-framework/.github/workflows/go-module-ci.yml@main
    with:
      module: caerus-framework-configuration
      deps: "caerus-framework caerus-framework-logs"
      coverage-min: "40"
      caerusvet: true
